<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>肤色季型色卡模板预览</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f4f4f1; color: #252525; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #686861; }
    section { margin-top: 34px; }
    h2 { font-size: 20px; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 8px; }
    img { width: 100%; display: block; aspect-ratio: 3 / 4; object-fit: contain; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 50% / 24px 24px; border-radius: 6px; }
    figcaption { margin-top: 8px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>肤色季型色卡模板预览</h1>
    <p>透明背景，中间椭圆为自拍照露出区域。正式使用时把用户照片放在模板下层。</p>
    <section><h2>四大季型</h2><div class="grid"><figure><img src="4-seasons/spring.png" alt="春季型"/><figcaption>春季型</figcaption></figure>
<figure><img src="4-seasons/summer.png" alt="夏季型"/><figcaption>夏季型</figcaption></figure>
<figure><img src="4-seasons/autumn.png" alt="秋季型"/><figcaption>秋季型</figcaption></figure>
<figure><img src="4-seasons/winter.png" alt="冬季型"/><figcaption>冬季型</figcaption></figure></div></section>
    <section><h2>十二子季型</h2><div class="grid"><figure><img src="12-seasons/bright_spring.png" alt="净春"/><figcaption>净春</figcaption></figure>
<figure><img src="12-seasons/warm_spring.png" alt="暖春"/><figcaption>暖春</figcaption></figure>
<figure><img src="12-seasons/light_spring.png" alt="浅春"/><figcaption>浅春</figcaption></figure>
<figure><img src="12-seasons/light_summer.png" alt="浅夏"/><figcaption>浅夏</figcaption></figure>
<figure><img src="12-seasons/soft_summer.png" alt="柔夏"/><figcaption>柔夏</figcaption></figure>
<figure><img src="12-seasons/cool_summer.png" alt="冷夏"/><figcaption>冷夏</figcaption></figure>
<figure><img src="12-seasons/soft_autumn.png" alt="柔秋"/><figcaption>柔秋</figcaption></figure>
<figure><img src="12-seasons/warm_autumn.png" alt="暖秋"/><figcaption>暖秋</figcaption></figure>
<figure><img src="12-seasons/deep_autumn.png" alt="深秋"/><figcaption>深秋</figcaption></figure>
<figure><img src="12-seasons/cool_winter.png" alt="冷冬"/><figcaption>冷冬</figcaption></figure>
<figure><img src="12-seasons/deep_winter.png" alt="深冬"/><figcaption>深冬</figcaption></figure>
<figure><img src="12-seasons/bright_winter.png" alt="净冬"/><figcaption>净冬</figcaption></figure></div></section>
  </main>
</body>
</html>
